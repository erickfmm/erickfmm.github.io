<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer Encoder Frankenstein - Config Builder</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --success: #3fb950;
  --warning: #d2991d;
  --input-bg: #0d1117;
  --radius: 6px;
  --sidebar-w: 260px;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar h2 { font-size:14px; color:var(--accent); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
.sidebar select, .sidebar button { width:100%; }
.main {
  flex: 1;
  padding: 24px 32px;
  overflow-y: auto;
  max-height: 100vh;
}
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:20px; }
.tab {
  padding: 10px 20px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  border-bottom: 2px solid transparent;
  transition: .15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }
h1 { font-size: 22px; margin-bottom: 4px; }
h2 { font-size: 16px; color: var(--accent); margin: 20px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
h3 { font-size: 14px; margin: 16px 0 8px; }
label { display: block; font-size: 13px; color: var(--text); margin: 10px 0 4px; font-weight: 600; }
label .req { color: var(--danger); margin-left: 2px; }
.desc { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; }
.desc p { margin: 0 0 4px; }
.desc p:last-child { margin-bottom: 0; }
.desc code { background: var(--surface); padding: 1px 4px; border-radius: 3px; font-family: var(--font-mono); font-size: 11px; }
.desc ul, .desc ol { margin: 2px 0; padding-left: 16px; }
.desc a { color: var(--accent); }
.desc strong { color: var(--text); }
.desc pre { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 11px; line-height: 1.4; margin: 4px 0; }
.desc table { border-collapse: collapse; width: 100%; margin: 4px 0; font-size: 11px; }
.desc th, .desc td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.desc th { background: var(--surface); color: var(--accent); font-weight: 600; }
input, select, textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-sans);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type="checkbox"] { width: auto; margin-right: 6px; accent-color: var(--accent); }
.checkbox-wrap { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; }
.checkbox-wrap label { margin:0; }
.field-group {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 8px 0 16px;
  background: var(--surface);
}
.field-group summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  color: var(--accent);
}
.field-group .req-tag {
  background: var(--danger);
  color:#fff;
  font-size:10px;
  padding:2px 6px;
  border-radius:3px;
  margin-left:6px;
  text-transform:uppercase;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  transition: .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color:#0d1117; border-color: var(--accent); font-weight:600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  max-height: 500px;
  overflow-y: auto;
}
.section { margin-bottom: 8px; }
.warn { color: var(--warning); font-size: 12px; }
.info { color: var(--text-muted); font-size: 12px; }
.optimizer-params { margin-top: 8px; }
.param-group { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin: 6px 0; }
.param-group summary { color: var(--text); font-size:13px; cursor:pointer; }
.list-builder-list { display:flex; flex-direction:column; gap:4px; }
.list-builder-item {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--border); border-radius:4px;
  padding:4px 10px; font-size:13px; font-family:var(--font-mono);
}
.list-builder-item .btn { padding:2px 6px; font-size:11px; }
/* responsive */
@media (max-width: 900px) { .app { flex-direction: column; } .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); } .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
<div class="sidebar" id="sidebar">
  <h2 id="sidebar-lang-title">🌐 Language</h2>
  <select id="lang-select" onchange="onLangChange()">
    <option value="en">English</option>
    <option value="es">Español</option>
  </select>

  <h2>📁 Load Example</h2>
  <button class="btn btn-sm" onclick="loadExample('mini')">Mini</button>
  <button class="btn btn-sm" onclick="loadExample('standard')">Standard</button>
  <button class="btn btn-sm" onclick="loadExample('frankenstein')" style="margin-top:4px">Frankenstein</button>
  <button class="btn btn-sm" onclick="loadExample('hybrid')" style="margin-top:4px">Hybrid (turbo_muon)</button>
  <button class="btn btn-sm" onclick="loadLocalExample('decoder_gpt_like.yaml')" style="margin-top:4px">GPT-like</button>
  <button class="btn btn-sm" onclick="loadLocalExample('decoder_llama_like.yaml')" style="margin-top:4px">LLaMA-like</button>
  <button class="btn btn-sm" onclick="loadLocalExample('decoder_retnet_mamba_like.yaml')" style="margin-top:4px">RetNet+Mamba</button>
  <button class="btn btn-sm" onclick="loadLocalExample('decoder_gated_mixed_adamw.yaml')" style="margin-top:4px">Gated Mixed</button>
  <h2 style="margin-top:12px">📂 Load from Repo</h2>
  <select id="repo-examples-select" style="font-size:11px;height:auto;max-height:150px">
    <option value="">— select an example —</option>
  </select>
  <button class="btn btn-sm" onclick="loadRepoExample()" style="margin-top:4px">Load Selected</button>
  <p style="margin-top:8px;font-size:11px">
    <a href="https://github.com/erickfmm/frankestein-transformer" target="_blank" style="color:var(--accent);text-decoration:none">
      <svg style="vertical-align:middle;margin-right:4px" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      View on GitHub →
    </a>
  </p>
</div>
<div class="main">
  <h1>🤖 Transformer Encoder Frankenstein — Config Builder</h1>
  <p id="lang-status" class="info" style="margin-bottom: 12px;"></p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('builder')" data-tab="builder">⚙️ Configuration Builder</button>
    <button class="tab" onclick="switchTab('yaml')" data-tab="yaml">📄 YAML Output</button>
    <button class="tab" onclick="switchTab('command')" data-tab="command">▶️ Command</button>
  </div>

  <!-- TAB: BUILDER -->
  <div class="tab-content active" id="tab-builder">
    <div id="builder-status" class="info"></div>
    <div id="model-section"></div>
    <div id="training-section"></div>
  </div>

  <!-- TAB: YAML -->
  <div class="tab-content" id="tab-yaml">
    <h2>Generated YAML Configuration</h2>
    <pre id="yaml-output">Fill the Configuration Builder tab first.</pre>
    <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="downloadYaml()">⬇ Download YAML</button>
      <button class="btn" onclick="copyYaml()">📋 Copy to Clipboard</button>
    </div>
  </div>

  <!-- TAB: COMMAND -->
  <div class="tab-content" id="tab-command">
    <h2>Command</h2>
    <div class="section">
      <label>Select Command</label>
      <select id="cmd-select" onchange="updateCmdPreview()">
        <option value="train">Train — Run main training</option>
        <option value="deploy">Deploy — Convert to deployment artifacts</option>
        <option value="quantize">Quantize — Export quantized format</option>
        <option value="infer">Infer — Run deployed model inference</option>
        <option value="sbert-train">SBERT Train — Train SBERT model</option>
        <option value="sbert-infer">SBERT Infer — Run SBERT inference</option>
      </select>
      <p id="cmd-info" class="info"></p>
    </div>
    <h2>Generated CLI Command</h2>
    <pre id="cmd-preview">Fill the Configuration Builder tab first.</pre>
    <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" onclick="copyCmd()">📋 Copy Command</button>
    </div>
    <div style="margin-top:16px">
      <label>Output Config Path</label>
      <input type="text" id="output-path" value="./config_generated.yaml" oninput="updateCmdPreview()">
    </div>
    <details class="field-group" style="margin-top:16px">
      <summary>Optional CLI Parameters</summary>
      <div style="margin-top:8px">
        <label>Device</label>
        <select id="opt-device" onchange="updateCmdPreview()">
          <option value="">(default)</option>
          <option value="--device auto">auto</option>
          <option value="--device cpu">cpu</option>
          <option value="--device cuda">cuda</option>
          <option value="--device mps">mps</option>
        </select>
      </div>
      <div id="opt-train" class="cmd-opt-group" style="display:none">
        <div class="checkbox-wrap" style="margin-top:8px">
          <input type="checkbox" id="opt-list-configs" onchange="updateCmdPreview()">
          <label>--list-configs</label>
        </div>
        <div>
          <label>--config-name</label>
          <input type="text" id="opt-config-name" oninput="updateCmdPreview()" placeholder="mini">
        </div>
      </div>
      <div id="opt-deploy" class="cmd-opt-group" style="display:none">
        <div><label>--checkpoint</label><input type="text" id="opt-deploy-checkpoint" oninput="updateCmdPreview()" placeholder="path/to/checkpoint.pt"></div>
        <div><label>--output</label><input type="text" id="opt-deploy-output" oninput="updateCmdPreview()" placeholder="deployed_model"></div>
        <div><label>--format</label><select id="opt-deploy-format" onchange="updateCmdPreview()"><option value="">(default)</option><option value="--format full">full</option><option value="--format quantized">quantized</option></select></div>
        <div class="checkbox-wrap"><input type="checkbox" id="opt-deploy-validate" onchange="updateCmdPreview()"><label>--validate</label></div>
      </div>
      <div id="opt-quantize" class="cmd-opt-group" style="display:none">
        <div><label>--checkpoint</label><input type="text" id="opt-quant-checkpoint" oninput="updateCmdPreview()" placeholder="path/to/checkpoint.pt"></div>
        <div><label>--output</label><input type="text" id="opt-quant-output" oninput="updateCmdPreview()" placeholder="deployed_model_quantized"></div>
        <div class="checkbox-wrap"><input type="checkbox" id="opt-quant-validate" onchange="updateCmdPreview()"><label>--validate</label></div>
      </div>
      <div id="opt-infer" class="cmd-opt-group" style="display:none">
        <div><label>--text</label><input type="text" id="opt-infer-text" oninput="updateCmdPreview()" placeholder="Input text"></div>
        <div><label>--model</label><input type="text" id="opt-infer-model" oninput="updateCmdPreview()" placeholder="deployed_model"></div>
        <div class="row"><div><label>--input</label><input type="text" id="opt-infer-input" oninput="updateCmdPreview()" placeholder="texts.txt"></div>
        <div><label>--output</label><input type="text" id="opt-infer-output" oninput="updateCmdPreview()" placeholder="preds.pt"></div></div>
        <div><label>--batch-size</label><input type="number" id="opt-infer-batch" oninput="updateCmdPreview()" value="" placeholder="8"></div>
        <div class="checkbox-wrap"><input type="checkbox" id="opt-infer-benchmark" onchange="updateCmdPreview()"><label>--benchmark</label></div>
      </div>
      <div id="opt-sbert-train" class="cmd-opt-group" style="display:none">
        <div><label>--output_dir</label><input type="text" id="opt-sbert-train-out" oninput="updateCmdPreview()" placeholder="./output/sbert_model"></div>
        <div><label>--batch_size</label><input type="number" id="opt-sbert-train-bs" oninput="updateCmdPreview()" value="16"></div>
        <div><label>--epochs</label><input type="number" id="opt-sbert-train-epochs" oninput="updateCmdPreview()" value="4"></div>
        <div><label>--pooling_mode</label><select id="opt-sbert-pooling" onchange="updateCmdPreview()"><option value="">(default)</option><option value="--pooling_mode mean">mean</option><option value="--pooling_mode max">max</option><option value="--pooling_mode cls">cls</option></select></div>
      </div>
      <div id="opt-sbert-infer" class="cmd-opt-group" style="display:none">
        <div><label>--model_path</label><input type="text" id="opt-sbert-infer-path" oninput="updateCmdPreview()" placeholder="./output/sbert_model"></div>
        <div><label>--mode</label><select id="opt-sbert-infer-mode" onchange="updateCmdPreview();updateSbertInferExtra()"><option value="">(default)</option><option value="--mode similarity">similarity</option><option value="--mode search">search</option><option value="--mode cluster">cluster</option><option value="--mode encode">encode</option></select></div>
        <div id="opt-sbert-infer-extra"></div>
      </div>
    </details>
    <p id="full-cmd-display" class="info" style="margin-top:8px;"></p>
  </div>
</div>
</div>

<script>
// ====== GLOBALS ======
let SCHEMA = null;
let lang = 'en';
let selectedCmd = 'train';
let configData = {};

const UI = {
  required: { en:'Required', es:'Obligatorio' },
  langTitle: { en:'🌐 Language', es:'🌐 Idioma' },
  cmdTitle: { en:'⚡ Command', es:'⚡ Comando' },
  loadExampleTitle: { en:'📁 Load Example', es:'📁 Cargar Ejemplo' },
  modelConfig: { en:'Model Configuration', es:'Configuración del Modelo' },
  trainingConfig: { en:'Training Configuration', es:'Configuración de Entrenamiento' },
  chooseModelType: { en:'Choose Model Type', es:'Elegir Tipo de Modelo' },
  customModel: { en:'Custom Model', es:'Modelo Personalizado' },
  baseModel: { en:'Base Model', es:'Modelo Base' },
  modelParams: { en:'Model Parameters', es:'Parámetros del Modelo' },
  baseModelConfig: { en:'Base Model Configuration', es:'Configuración de Modelo Base' },
  tokenizerConfig: { en:'Tokenizer Configuration', es:'Configuración del Tokenizador' },
  optimizerConfig: { en:'Optimizer Configuration', es:'Configuración del Optimizador' },
  optimizerParamsInfo: { en:'Parameters are prefixed with optimizer class name (e.g. adamw-lr_embeddings).', es:'Los parámetros llevan prefijo de la clase del optimizador (ej. adamw-lr_embeddings).' },
  trainingParams: { en:'Training Parameters', es:'Parámetros de Entrenamiento' },
  generalTraining: { en:'General Training Parameters', es:'Parámetros Generales de Entrenamiento' },
  datasetParams: { en:'Dataset Parameters', es:'Parámetros de Dataset' },
  optimizer: { en:'Optimizer', es:'Optimizador' },
  scheduler: { en:'Scheduler', es:'Scheduler' },
  gradientSettings: { en:'Gradient Settings', es:'Configuración de Gradientes' },
  checkpointSettings: { en:'Checkpoint Settings', es:'Configuración de Checkpoints' },
  loggingSettings: { en:'Logging Settings', es:'Configuración de Logging' },
  gpuSettings: { en:'GPU Settings', es:'Configuración de GPU' },
  mixedPrecision: { en:'Mixed Precision', es:'Precisión Mixta' },
  embeddingsGroup: { en:'Embeddings', es:'Embeddings' },
  normGroup: { en:'Normalization Layers', es:'Capas de Normalización' },
  attnGroup: { en:'Attention Layers', es:'Capas de Atención' },
  otherGroup: { en:'Other Parameters', es:'Otros Parámetros' },
  selectItems: { en:'Select items', es:'Seleccionar items' },
};

const t = (key) => (UI[key] ? (UI[key][lang] || UI[key]['en']) : key);

// ====== INIT ======
async function init() {
  loadSchema();
}

async function loadSchema() {
  const statusEl = document.getElementById('builder-status');
  try {
    const resp = await fetch('/frankestein-transformer/schema.yaml');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const yamlText = await resp.text();
    SCHEMA = jsyaml.load(yamlText);
    statusEl.textContent = '✅ Schema loaded successfully.';
    document.getElementById('lang-status').textContent = 'Language: ' + (lang==='en'?'English':'Español');
    loadExample('standard');
    updateCmdPreview();
  } catch(e) {
    statusEl.textContent = '❌ Error loading /frankestein-transformer/schema.yaml';
    console.error(e);
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'yaml') updateYamlOutput();
  if (name === 'command') updateCmdPreview();
}

// ====== SCHEMA HELPERS ======
function getLoc(fieldSchema, key, fallback) {
  const locKey = lang === 'en' ? key : `${key}_es`;
  return fieldSchema[locKey] || fieldSchema[key] || fallback || '';
}

function getTitle(fieldSchema, fallback) {
  return getLoc(fieldSchema, 'title', fallback || '');
}

function getDesc(fieldSchema) {
  const raw = getLoc(fieldSchema, 'description', '');
  return raw ? marked.parse(raw) : '';
}

// ====== RENDER HELPERS ======
function createFieldGroup(label, required, desc, content) {
  const reqTag = required ? `<span class="req-tag">${t('required')}</span>` : '';
  return `<details class="field-group" ${required ? 'open':''}>
    <summary>${label}${reqTag}</summary>
    ${desc ? `<div class="desc" style="margin-top:8px">${desc}</div>` : ''}
    ${content}
  </details>`;
}

function createLabel(name, title, required) {
  return `<label>${title}${required ? '<span class="req">*</span>' : ''}</label>`;
}

function createId(name) {
  return 'f_' + name.replace(/[^a-zA-Z0-9]/g, '_');
}

// ====== FIELD RENDERERS ======
function renderField(name, fieldSchema, prefix) {
  const type = fieldSchema.type;
  const title = getTitle(fieldSchema, name);
  const desc = getDesc(fieldSchema);
  const fieldId = createId(prefix ? prefix + '.' + name : name);
  const examples = fieldSchema.examples || [];

  let html = `<div class="section">`;

  if (type === 'boolean') {
    const def = examples[0] !== undefined ? examples[0] : false;
    html += `<div class="checkbox-wrap">
      <input type="checkbox" id="${fieldId}" ${def ? 'checked' : ''}>
      <label for="${fieldId}" style="margin:0">${title}</label>
    </div>`;
  } else if (type === 'integer') {
    const def = examples.length > 0 ? examples[0] : 0;
    const min = fieldSchema.minimum !== undefined ? `min="${fieldSchema.minimum}"` : '';
    const max = fieldSchema.maximum !== undefined ? `max="${fieldSchema.maximum}"` : '';
    html += `<input type="number" id="${fieldId}" value="${def}" step="1" ${min} ${max}>`;
  } else if (type === 'number') {
    const def = examples.length > 0 ? examples[0] : 0;
    const min = fieldSchema.minimum !== undefined ? `min="${fieldSchema.minimum}"` : '';
    const max = fieldSchema.maximum !== undefined ? `max="${fieldSchema.maximum}"` : '';
    html += `<input type="number" id="${fieldId}" value="${def}" step="any" ${min} ${max}>`;
  } else if (type === 'string') {
    const enm = fieldSchema.enum;
    const def = examples.length > 0 ? examples[0] : '';
    if (enm) {
      html += `<select id="${fieldId}">`;
      enm.forEach(v => {
        html += `<option value="${v}" ${v === def ? 'selected' : ''}>${v}</option>`;
      });
      html += `</select>`;
    } else {
      html += `<input type="text" id="${fieldId}" value="${def}">`;
    }
  } else if (type === 'array') {
    const itemsSchema = fieldSchema.items || {};
    const enm = itemsSchema.enum;
    const def = examples.length > 0 ? examples[0] : [];
    if (enm && name === 'layer_pattern') {
      html += `<div class="list-builder" data-field="${fieldId}">`;
      html += `<div style="display:flex;gap:4px;margin-bottom:6px">`;
      html += `<select id="${fieldId}_add_select" style="flex:1">`;
      enm.forEach(v => html += `<option value="${v}">${v}</option>`);
      html += `</select>`;
      html += `<button type="button" class="btn btn-sm" onclick="listBuilderAdd('${fieldId}')">+ Add</button>`;

    } else if (enm) {
      html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">${t('selectItems')}:</div>`;
      html += `<div id="${fieldId}_container" style="display:flex;flex-wrap:wrap;gap:4px">`;
      enm.forEach(v => {
        const checked = def.includes(v);
        html += `<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;margin:2px 0;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer">
          <input type="checkbox" class="array-cb" data-field="${fieldId}" value="${v}" ${checked ? 'checked' : ''}>${v}
        </label>`;
      });
      html += `</div>`;
    } else {
      const defStr = Array.isArray(def) ? def.join('\n') : '';
      html += `<textarea id="${fieldId}" rows="4">${defStr}</textarea>`;
      html += `<div class="info">One per line</div>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderObject(name, objSchema, prefix, level) {
  const props = objSchema.properties || {};
  const required = objSchema.required || [];
  const pp = prefix ? prefix + '.' + name : name;
  let html = '';
  for (const [propName, propSchema] of Object.entries(props)) {
    const propTitle = getTitle(propSchema, propName);
    const propDesc = getDesc(propSchema);
    const isReq = required.includes(propName);
    const propType = propSchema.type;

    if (propType === 'object') {
      html += createFieldGroup(propTitle, isReq, propDesc, renderObject(propName, propSchema, pp, level+1));
    } else {
      html += `<div class="section">`;
      if (isReq) {
        html += createLabel(propName, propTitle + ' *', true);
      } else {
        html += createLabel(propName, propTitle, false);
      }
      if (propDesc) html += `<div class="desc">${propDesc}</div>`;
      html += renderField(propName, propSchema, pp).replace(/<div class="section">/, '').replace(/<\/div>$/, '');
      html += `</div>`;
    }
  }
  return html;
}

// ====== VALUE READERS ======
function readFieldValue(name, fieldSchema, prefix) {
  const fieldId = createId(prefix ? prefix + '.' + name : name);
  const type = fieldSchema.type;
  const el = document.getElementById(fieldId);

  if (!el) {
    // array with checkboxes
    if (type === 'array') {
      const cbs = document.querySelectorAll(`.array-cb[data-field="${fieldId}"]`);
      const vals = [];
      cbs.forEach(cb => { if (cb.checked) vals.push(cb.value); });
      return vals;
    }
    return null;
  }

  if (el.type === 'hidden') {
    try { return JSON.parse(el.value); } catch(e) { return el.value; }
  }
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') {
    const v = parseFloat(el.value);
    return type === 'integer' ? Math.round(v) : v;
  }
  if (el.tagName === 'SELECT') return el.value;
  if (el.tagName === 'TEXTAREA') {
    const lines = el.value.split('\n').map(l => l.trim()).filter(l => l);
    if (type === 'array') return lines;
    return el.value;
  }
  return el.value;
}

function readObjectValue(name, objSchema, prefix) {
  const props = objSchema.properties || {};
  const pp = prefix ? prefix + '.' + name : name;
  const result = {};
  for (const [propName, propSchema] of Object.entries(props)) {
    if (propSchema.type === 'object') {
      result[propName] = readObjectValue(propName, propSchema, pp);
    } else {
      result[propName] = readFieldValue(propName, propSchema, pp);
    }
  }
  return result;
}

function onOptimizerChange() {
  const optEl = document.getElementById(createId('training.optimizer.optimizer_class'));
  const optClass = optEl ? optEl.value : 'adamw';
  const container = document.getElementById('optimizer-param-section');
  if (!container) return;

  const groups = ['embeddings', 'norms', 'ode', 'retnet', 'mamba', 'attention', 'other'];
  const groupLabels = {
    embeddings: t('embeddingsGroup'), norms: t('normGroup'),
    ode: 'ODE', retnet: 'RetNet', mamba: 'Mamba',
    attention: t('attnGroup'), other: t('otherGroup')
  };
  const descRef = getLoc(SCHEMA.properties.training.properties.optimizer.properties.parameters, 'description', '');

  let html = `<div class="info" style="margin:8px 0">${t('optimizerParamsInfo')}</div>`;

  // Optimizer-specific extra params
  const xRef = SCHEMA.properties.training.properties.optimizer.properties.parameters['x_parameter_reference'];
  const byOpt = xRef ? xRef.by_optimizer : {};
  const optInfo = byOpt[optClass] || {};
  const specificSuffixes = optInfo.specific_global_suffixes || [];

  groups.forEach(group => {
    html += `<details class="param-group"><summary>${groupLabels[group]}</summary>`;
    html += `<div class="row">`;
    const pref = optClass + '-';
    html += `<div>${createLabel(`${pref}lr_${group}`, 'Learning Rate', false)}
      <input type="number" id="${createId('training.optimizer.' + pref + 'lr_' + group)}" value="${getDefaultForGroup(group, 'lr')}" step="any">
    </div>`;
    html += `<div>${createLabel(`${pref}wd_${group}`, 'Weight Decay', false)}
      <input type="number" id="${createId('training.optimizer.' + pref + 'wd_' + group)}" value="${getDefaultForGroup(group, 'wd')}" step="any">
    </div>`;
    html += `</div><div class="row">`;
    html += `<div>${createLabel(`${pref}betas_${group}`, 'Betas', false)}
      <input type="text" id="${createId('training.optimizer.' + pref + 'betas_' + group)}" value="[0.9, 0.95]">
    </div>`;
    html += `<div>${createLabel(`${pref}eps_${group}`, 'Epsilon', false)}
      <input type="number" id="${createId('training.optimizer.' + pref + 'eps_' + group)}" value="1e-8" step="any">
    </div>`;
    html += `</div></details>`;
  });

  // Extra optimizer-specific params
  if (specificSuffixes.length > 0) {
    html += `<details class="param-group" open><summary>${optClass} — specific parameters</summary>`;
    specificSuffixes.forEach(suffix => {
      const keyId = createId('training.optimizer.' + optClass + '-' + suffix);
      html += `<div class="row"><div>${createLabel(optClass + '-' + suffix, suffix, false)}
        <input type="text" id="${keyId}" value="${getDefaultForSpecific(suffix)}">
      </div></div>`;
    });
    html += `</details>`;
  }

  container.innerHTML = html;
}

function getDefaultForGroup(group, param) {
  const defaults = {
    lr: { embeddings:'1e-6', norms:'5e-6', ode:'1e-7', retnet:'5e-6', mamba:'2e-6', attention:'3e-6', other:'2e-6' },
    wd: { embeddings:'0.01', norms:'0.001', ode:'0.01', retnet:'0.01', mamba:'0.01', attention:'0.01', other:'0.01' }
  };
  return (defaults[param] && defaults[param][group]) ? defaults[param][group] : '0.01';
}

function getDefaultForSpecific(suffix) {
  const map = { momentum: '0.95', nesterov: 'true', ns_steps: '4', ns_eps: '1e-7',
    d_coef: '0.8', cautious_clip: '0.5', gamma: '0.5', rank: '64', update_proj_gap: '1',
    scale: '1.0', scale_type: 'channel', proj_type: 'std', scale_front: 'false', disable_nl: 'false',
    quant_bits: '4', update_k: '100', rho: '0.1', beta2_decay: '-0.8', clip_threshold: '1.0',
    eps1: '1e-30', eps2: '1e-3' };
  return map[suffix] || '0';
}

// ====== LIST BUILDER (layer_pattern) ======
function listBuilderRender(fieldId) {
  const hidden = document.getElementById(fieldId);
  const list = document.getElementById(fieldId + '_list');
  if (!hidden || !list) return;
  const items = JSON.parse(hidden.value || '[]');
  list.innerHTML = items.map((item, i) => {
    const upDisabled = i === 0;
    const dnDisabled = i === items.length - 1;
    return `<div class="list-builder-item">
      <span>${item}</span>
      <div>
        <button type="button" class="btn btn-sm" onclick="listBuilderMove('${fieldId}',${i},${i-1})" ${upDisabled ? 'disabled style="opacity:0.3"' : ''}>↑</button>
        <button type="button" class="btn btn-sm" onclick="listBuilderMove('${fieldId}',${i},${i+1})" ${dnDisabled ? 'disabled style="opacity:0.3"' : ''}>↓</button>
        <button type="button" class="btn btn-sm" style="color:var(--danger)" onclick="listBuilderRemove('${fieldId}',${i})">×</button>
      </div>
    </div>`;
  }).join('');
}

function listBuilderAdd(fieldId) {
  const select = document.getElementById(fieldId + '_add_select');
  const hidden = document.getElementById(fieldId);
  const items = JSON.parse(hidden.value || '[]');
  items.push(select.value);
  hidden.value = JSON.stringify(items);
  listBuilderRender(fieldId);
}

function listBuilderRemove(fieldId, index) {
  const hidden = document.getElementById(fieldId);
  const items = JSON.parse(hidden.value || '[]');
  items.splice(index, 1);
  hidden.value = JSON.stringify(items);
  listBuilderRender(fieldId);
}

function listBuilderMove(fieldId, from, to) {
  const hidden = document.getElementById(fieldId);
  const items = JSON.parse(hidden.value || '[]');
  if (to < 0 || to >= items.length) return;
  const [moved] = items.splice(from, 1);
  items.splice(to, 0, moved);
  hidden.value = JSON.stringify(items);
  listBuilderRender(fieldId);
}

function initListBuilders() {
  document.querySelectorAll('.list-builder').forEach(el => {
    listBuilderRender(el.dataset.field);
  });
}

function isListBuilder(fieldId) {
  const el = document.getElementById(fieldId);
  return el && el.type === 'hidden' && document.querySelector(`.list-builder[data-field="${fieldId}"]`);
}

  const optClass = readFieldValue('optimizer_class', trainingProps.optimizer.properties.optimizer_class, 'training.optimizer');
  const optParams = {};
  const pref = optClass + '-';
  const groups = ['embeddings', 'norms', 'ode', 'retnet', 'mamba', 'attention', 'other'];
  const sharedKeys = ['lr', 'wd', 'betas', 'eps'];
  groups.forEach(g => {
    sharedKeys.forEach(k => {
      const id = createId('training.optimizer.' + pref + k + '_' + g);
      const el = document.getElementById(id);
      if (el) {
        let val;
        if (el.type === 'number') val = parseFloat(el.value);
        else if (el.tagName === 'SELECT') val = el.value;
        else val = el.value;
        // Parse betas as array
        if (k === 'betas') {
          try { val = JSON.parse(val); } catch(e) { val = val; }
        }
        optParams[pref + k + '_' + g] = val;
      }
    });
  });

  // Optimizer-specific params
  const xRef = (trainingProps.optimizer.properties.parameters['x_parameter_reference'] || {});
  const byOpt = xRef.by_optimizer || {};
  const optInfo = byOpt[optClass] || {};
  const specificSuffixes = optInfo.specific_global_suffixes || [];
  specificSuffixes.forEach(suffix => {
    const id = createId('training.optimizer.' + pref + suffix);
    const el = document.getElementById(id);
    if (el) {
      let val = el.value;
      if (val === 'true') val = true;
      else if (val === 'false') val = false;
      else if (!isNaN(parseFloat(val)) && val.trim() !== '') val = parseFloat(val);
      optParams[pref + suffix] = val;
    }
  });

  training.optimizer = { optimizer_class: optClass, parameters: optParams };
  config.training = training;

  configData = config;
  return config;
}

// ====== YAML GENERATION ======
function objToYaml(obj, indent) {
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  let out = '';
  for (const [key, value] of Object.entries(obj)) {
    out += pad + key + ':';
    if (value === null || value === undefined) {
      out += '\n';
    } else if (typeof value === 'object' && !Array.isArray(value)) {
      out += '\n' + objToYaml(value, indent + 1);
    } else if (Array.isArray(value)) {
      if (value.length === 0) {
        out += ' []\n';
      } else {
        out += '\n';
        value.forEach(item => { out += pad + '  - ' + formatYamlScalar(item) + '\n'; });
      }
    } else {
      out += ' ' + formatYamlScalar(value) + '\n';
    }
  }
  return out;
}

function formatYamlScalar(val) {
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (typeof val === 'number') {
    if (Number.isInteger(val)) return String(val);
    // scientific notation for small numbers
    if (Math.abs(val) < 1e-4 && val !== 0) return val.toExponential(1).replace('+', '');
    return String(val);
  }
  if (typeof val === 'string') {
    if (/[:\{\}\[\],&\*\?!|>'"%@`#]/.test(val) || val.includes('\n')) {
      return '"' + val.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"';
    }
    return val;
  }
  return String(val);
}

function generateYaml() {
  const config = buildConfig();
  return objToYaml(config);
}

function updateYamlOutput() {
  try {
    const yaml = generateYaml();
    document.getElementById('yaml-output').textContent = yaml;
  } catch(e) {
    document.getElementById('yaml-output').textContent = 'Error: ' + e.message;
  }
}

function downloadYaml() {
  const yaml = generateYaml();
  const blob = new Blob([yaml], {type:'text/yaml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'config.yaml'; a.click();
  URL.revokeObjectURL(url);
}

function copyYaml() {
  const yaml = document.getElementById('yaml-output').textContent;
  navigator.clipboard.writeText(yaml).then(() => alert('YAML copied!')).catch(() => {});
}

  // Build optional flags
  let extraFlags = [];
  const deviceEl = document.getElementById('opt-device');
  if (deviceEl && deviceEl.value) extraFlags.push(deviceEl.value);

  if (selectedCmd === 'train') {
    const lc = document.getElementById('opt-list-configs');

    if (cp && cp.value.trim()) extraFlags.push('--checkpoint ' + cp.value.trim());
    const out = document.getElementById('opt-deploy-output');

  if (selectedCmd === 'quantize') {
    const cp = document.getElementById('opt-quant-checkpoint');
    if (cp && cp.value.trim()) extraFlags.push('--checkpoint ' + cp.value.trim());
    const out = document.getElementById('opt-quant-output');
    if (out && out.value.trim()) extraFlags.push('--output ' + out.value.trim());

    const bs = document.getElementById('opt-sbert-train-bs');

    const pm = document.getElementById('opt-sbert-pooling');
    if (pm && pm.value) extraFlags.push(pm.value);
  }
  if (selectedCmd === 'sbert-infer') {
    const mp = document.getElementById('opt-sbert-infer-path');
    if (mp && mp.value.trim()) extraFlags.push('--model_path ' + mp.value.trim());
    const mode = document.getElementById('opt-sbert-infer-mode');

function loadExample(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  configData = preset;
  if (SCHEMA) buildAll();
  // Apply preset values after DOM renders
  setTimeout(() => applyPreset(name), 100);
}

function applyPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;

  // Model mode
  const modeRadio = document.querySelector(`input[name="model_mode"][value="${preset.model_mode}"]`);
  if (modeRadio) { modeRadio.checked = true; onModelModeChange(); }

  // Model class
  if (preset.model_class) {
    const el = document.getElementById(createId('model_class'));
    if (el && preset.model_class) el.value = preset.model_class;
  }

  // Model fields
  if (preset.model) {
    for (const [key, val] of Object.entries(preset.model)) {
      const id = createId('model.' + key);
      const el = document.getElementById(id);
      if (!el) continue;
      if (Array.isArray(val)) {
        if (isListBuilder(id)) {
          const hidden = document.getElementById(id);
          hidden.value = JSON.stringify(val);
          listBuilderRender(id);
        } else {
          const cbs = document.querySelectorAll(`.array-cb[data-field="${id}"]`);
          cbs.forEach(cb => { cb.checked = val.includes(cb.value); });
        }
      } else if (typeof val === 'boolean') {
        el.checked = val;
      } else {
        el.value = val;
      }
    }
  }

  // Training fields
  if (preset.training) {
    for (const [key, val] of Object.entries(preset.training)) {
      if (key === 'optimizer') {
        const optEl = document.getElementById(createId('training.optimizer.optimizer_class'));
        if (optEl) { optEl.value = val; onOptimizerChange(); }
      } else {
        const id = createId('training.' + key);
        const el = document.getElementById(id);
        if (!el) continue;
        if (typeof val === 'boolean') el.checked = val;
        else el.value = val;
      }
    }
  }

  updateYamlOutput();
  updateCmdPreview();
}

    if (!config) throw new Error('Empty config');
    configData = config;
    if (SCHEMA) buildAll();
    setTimeout(() => applyYamlConfig(config), 150);
  } catch(e) {
    alert('Failed to load example: ' + e.message);
    console.error(e);
  }
}

function applyYamlConfig(config) {
  // Set model mode
  if (config.model_class) {
    const modeRadio = document.querySelector('input[name="model_mode"][value="custom"]');
    if (modeRadio) { modeRadio.checked = true; onModelModeChange(); }
    const mcEl = document.getElementById(createId('model_class'));
    if (mcEl) mcEl.value = config.model_class;
  } else if (config.base_model) {
    const modeRadio = document.querySelector('input[name="model_mode"][value="base"]');
    if (modeRadio) { modeRadio.checked = true; onModelModeChange(); }
    const bmEl = document.getElementById(createId('base_model'));
    if (bmEl) bmEl.value = config.base_model;
  }

  // Apply model fields
  if (config.model) {
    for (const [key, val] of Object.entries(config.model)) {
      const id = createId('model.' + key);
      const el = document.getElementById(id);
      if (!el) continue;
      if (Array.isArray(val)) {
        if (isListBuilder(id)) {
          const hidden = document.getElementById(id);
          hidden.value = JSON.stringify(val);
          listBuilderRender(id);
        } else {
          const cbs = document.querySelectorAll(`.array-cb[data-field="${id}"]`);
          cbs.forEach(cb => { cb.checked = val.includes(cb.value); });
        }
      } else if (typeof val === 'boolean') { el.checked = val; }
      else { el.value = val; }
    }
  }

  // Apply training fields
  if (config.training) {
    for (const [key, val] of Object.entries(config.training)) {
      if (key === 'optimizer') continue;
      const id = createId('training.' + key);
      const el = document.getElementById(id);
      if (!el) continue;
      if (typeof val === 'boolean') el.checked = val;
      else el.value = val;
    }
    if (config.training.optimizer) {
      const opt = config.training.optimizer;
      const optClass = opt.optimizer_class || 'adamw';
      const optEl = document.getElementById(createId('training.optimizer.optimizer_class'));
      if (optEl) { optEl.value = optClass; onOptimizerChange(); }
      // Apply optimizer params after optimizer change renders fields
      if (opt.parameters) {
        setTimeout(() => {
          for (const [k, v] of Object.entries(opt.parameters)) {
            const id = createId('training.optimizer.' + k);
            const el = document.getElementById(id);
            if (!el) continue;
            if (typeof v === 'boolean') el.checked = v;
            else el.value = v;
          }
        }, 50);
      }
    }
  }

  updateYamlOutput();
  updateCmdPreview();
}

// ====== REACTIVE LANGUAGE SWITCH ======
function onLangChange() {
  // Save all current form values
  const saved = saveAllFormValues();
  lang = document.getElementById('lang-select').value;
  document.getElementById('lang-status').textContent = 'Language: ' + (lang==='en'?'English':'Español');
  document.getElementById('sidebar-lang-title').textContent = UI.langTitle[lang] || UI.langTitle.en;
  if (SCHEMA) {
    buildAll();
    // Restore saved values after rebuild
    setTimeout(() => restoreAllFormValues(saved), 100);
  }
}

function saveAllFormValues() {
  const store = {};
  document.querySelectorAll('input:not([type="hidden"]):not([type="radio"]), select, textarea').forEach(el => {
    if (el.id && !el.id.startsWith('repo-') && !el.id.startsWith('opt-') && !el.id.startsWith('opt_')) {
      if (el.type === 'checkbox') store[el.id] = el.checked;
      else if (el.type === 'number') store[el.id] = el.value;
      else store[el.id] = el.value;
    }
  });
  // Radio buttons
  const modeRadio = document.querySelector('input[name="model_mode"]:checked');
  if (modeRadio) store['model_mode'] = modeRadio.value;
  // array checkboxes
  document.querySelectorAll('.array-cb').forEach(cb => {
    if (!store['_array_cb']) store['_array_cb'] = {};
    store['_array_cb'][cb.dataset.field] = store['_array_cb'][cb.dataset.field] || [];
    if (cb.checked) store['_array_cb'][cb.dataset.field].push(cb.value);
  });
  // list builder hidden fields
  document.querySelectorAll('.list-builder').forEach(lb => {
    const hidden = document.getElementById(lb.dataset.field);
    if (hidden) store[hidden.id] = hidden.value;
  });
  return store;
}

function restoreAllFormValues(saved) {
  if (!saved) return;
  document.querySelectorAll('input:not([type="hidden"]):not([type="radio"]), select, textarea').forEach(el => {
    if (el.id && saved[el.id] !== undefined) {
      if (el.type === 'checkbox') el.checked = saved[el.id];
      else el.value = saved[el.id];
    }
  });
  // Radio
  if (saved['model_mode']) {
    const r = document.querySelector(`input[name="model_mode"][value="${saved['model_mode']}"]`);
    if (r) { r.checked = true; onModelModeChange(); }
  }
  // array checkboxes
  if (saved['_array_cb']) {
    for (const [field, vals] of Object.entries(saved['_array_cb'])) {
      document.querySelectorAll(`.array-cb[data-field="${field}"]`).forEach(cb => {
        cb.checked = vals.includes(cb.value);
      });
    }
  }
  // list builders
  if (saved) {
    document.querySelectorAll('.list-builder').forEach(lb => {
      const hidden = document.getElementById(lb.dataset.field);
      if (hidden && saved[hidden.id] !== undefined) {
        hidden.value = saved[hidden.id];
        listBuilderRender(hidden.id);
      }
    });
  }
  updateYamlOutput();
  updateCmdPreview();
}

document.addEventListener('DOMContentLoaded', init);
</script>
